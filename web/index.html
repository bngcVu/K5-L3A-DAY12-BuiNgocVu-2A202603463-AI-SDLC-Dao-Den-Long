<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đảo Đèn Lồng</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0a1a; font-family: system-ui, sans-serif; color: #ffe2a8; }
  canvas { display: block; }
  #hud { position: fixed; top: 10px; left: 12px; right: 12px; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; font-size: 18px; text-shadow: 0 1px 4px #000; }
  #hud span { background: rgba(20,12,40,.55); padding: 6px 12px; border-radius: 12px; border: 1px solid rgba(255,170,60,.35); }
  #help { position: fixed; bottom: 10px; left: 12px; font-size: 13px; opacity: .75; pointer-events: none; }
  #msg { position: fixed; top: 60px; width: 100%; text-align: center; font-size: 20px; pointer-events: none; text-shadow: 0 1px 6px #000; }
  #end { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(10,6,24,.72); text-align: center; }
  #end h1 { font-size: 44px; margin: 0 0 8px; } #end p { font-size: 20px; margin: 4px; }
  #end button { margin-top: 18px; font-size: 20px; padding: 10px 28px; border-radius: 14px; border: 0; background: #ffb347; color: #2a1608; cursor: pointer; }
</style>
</head>
<body>
<div id="hud"><span id="flames"></span><span id="carry"></span><span id="lamps"></span><span id="time"></span><span id="score"></span></div>
<div id="msg"></div>
<div id="help">WASD đi · Chuột kéo xoay camera · Space nhảy · E nạp đèn · F tỏa sáng (tốn 2 đom đóm) · R chơi lại</div>
<div id="end"><h1 id="endTitle"></h1><p id="endText"></p><p id="endScore"></p><button id="again">Chơi lại (R)</button></div>
<script type="importmap">{ "imports": { "three": "/vendor/three/three.module.js" } }</script>
<script type="module" src="/main.js"></script>
</body>
</html>
